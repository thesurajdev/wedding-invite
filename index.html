<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>शुभ विवाह</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Mukta:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          maroon: { deep: '#3A0B12', DEFAULT: '#7A1E2B', light: '#9C2C3A' },
          marigold: { DEFAULT: '#E8961F', light: '#F4B94D' },
          brass: { DEFAULT: '#C9A34E', light: '#F0D896', dark: '#8A6420' },
          cream: '#F6EEDD',
          ink: '#2A1810',
        },
        fontFamily: {
          display: ['"Yatra One"', 'cursive'],
          body: ['Mukta', 'sans-serif'],
          serif: ['"Cormorant Garamond"', 'serif'],
        },
      }
    }
  }
</script>
<style>
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important;}
  }

  html, body{ height:100%; }
  body{ overflow-x:hidden; font-size:17px; line-height:1.7; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; font-variant-numeric:lining-nums proportional-nums; }

  html{ scrollbar-width:none; -ms-overflow-style:none; }
  html::-webkit-scrollbar{ display:none; }
  body::-webkit-scrollbar{ display:none; }

  .flame{ transform-origin:50% 100%; animation:flicker 1.1s ease-in-out infinite alternate; }
  @keyframes flicker{
    0%{transform:scaleY(1) rotate(-2deg);}
    50%{transform:scaleY(1.08) rotate(1deg);}
    100%{transform:scaleY(0.95) rotate(2deg);}
  }

  .pulse-text{ animation:pulseText 2s ease-in-out infinite; }
  @keyframes pulseText{
    0%,100%{opacity:0.5;}
    50%{opacity:0.95;}
  }

  .scroll-tick{ animation:scrollDown 1.6s ease-in-out infinite; }
  @keyframes scrollDown{
    0%{transform:scaleY(0); transform-origin:top;}
    50%{transform:scaleY(1); transform-origin:top;}
    50.1%{transform-origin:bottom;}
    100%{transform:scaleY(0); transform-origin:bottom;}
  }

  #preloader.hide{ opacity:0; visibility:hidden; pointer-events:none; }

  /* Door scene is visible by DEFAULT (not opacity:0) so there is never a
     gap between first paint and JS execution during which the hero behind
     it could flash into view. JS only ever needs to fade it OUT (via
     .dismiss) once the preloader finishes; the .show class is kept for
     backwards compatibility but is no longer required to reveal it. */
  #door-scene{ opacity:1; visibility:visible; transition:opacity .6s ease, visibility .6s ease; }
  #door-scene.show{ opacity:1; visibility:visible; }
  #door-scene.dismiss{ opacity:0; visibility:hidden; transition:opacity 1s ease, visibility 1s ease; }

  .temple-gate{ perspective:3200px; }

  .wood-grain{
    background-color:#5a3b22;
    background-image:
      linear-gradient(90deg, rgba(0,0,0,0.14) 0%, transparent 3%, transparent 97%, rgba(0,0,0,0.14) 100%),
      repeating-linear-gradient(89deg,
        rgba(255,255,255,0.05) 0px, rgba(255,255,255,0.05) 1px,
        rgba(0,0,0,0.06) 1px, rgba(0,0,0,0.06) 2px,
        transparent 2px, transparent 5px,
        rgba(0,0,0,0.09) 5px, rgba(0,0,0,0.09) 6px,
        transparent 6px, transparent 11px
      ),
      repeating-linear-gradient(91deg,
        rgba(80,50,25,0.4) 0px, rgba(80,50,25,0.4) 3px,
        rgba(120,80,42,0.35) 3px, rgba(120,80,42,0.35) 9px,
        rgba(60,38,18,0.4) 9px, rgba(60,38,18,0.4) 14px
      ),
      radial-gradient(ellipse 140% 60% at 50% -10%, rgba(0,0,0,0.35), transparent 55%),
      radial-gradient(ellipse 140% 60% at 50% 110%, rgba(0,0,0,0.4), transparent 55%),
      linear-gradient(180deg, #6e4a2a 0%, #543822 45%, #3c281688 70%, #2a1c0f 100%);
    background-blend-mode:overlay, multiply, normal, normal, normal, normal;
  }
  .wood-grain-panel{
    background-color:#4d3319;
    background-image:
      repeating-linear-gradient(88deg,
        rgba(255,255,255,0.04) 0px, rgba(255,255,255,0.04) 1px,
        rgba(0,0,0,0.08) 1px, rgba(0,0,0,0.08) 2px,
        transparent 2px, transparent 6px
      ),
      radial-gradient(ellipse 100% 100% at 50% 50%, rgba(0,0,0,0.45), transparent 70%);
  }

  .grain-overlay{
    position:absolute; inset:0;
    opacity:0.5;
    mix-blend-mode:overlay;
    pointer-events:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.35'/></svg>");
    background-size:180px 180px;
  }

  .door-leaf{
    transition:transform 1.4s cubic-bezier(.45,0,.2,1);
    transform-style:preserve-3d;
    will-change:transform;
  }
  .door-leaf.left{ transform-origin:left center; }
  .door-leaf.right{ transform-origin:right center; }
  #door-scene.opened .door-leaf.left{ transform:rotateY(-100deg); }
  #door-scene.opened .door-leaf.right{ transform:rotateY(100deg); }

  .door-leaf::after{
    content:'';
    position:absolute; inset:0;
    background:linear-gradient(90deg, transparent 55%, rgba(0,0,0,0.55) 100%);
    opacity:0;
    transition:opacity 1.4s ease;
    pointer-events:none;
  }
  .door-leaf.right::after{ background:linear-gradient(270deg, transparent 55%, rgba(0,0,0,0.55) 100%); }
  #door-scene.opened .door-leaf::after{ opacity:1; }

  #door-scene.opened .glow-inside{ opacity:1; }
  .glow-inside{ transition:opacity 1.2s ease .2s; }

  #site{ opacity:0; visibility:hidden; }
  #site.reveal{ opacity:1; visibility:visible; }

  /* No-JS / JS-failure safety net: if JS never runs, force the site visible
     and hide the preloader + door overlay so the page is never blank. */
  html.no-js #site{ opacity:1 !important; visibility:visible !important; }
  html.no-js #preloader,
  html.no-js #door-scene{ display:none !important; }

  .panel-inlay{
    position:relative;
    box-shadow:
      inset 0 2px 4px rgba(0,0,0,0.55),
      inset 0 -2px 3px rgba(255,255,255,0.06),
      inset 2px 0 4px rgba(0,0,0,0.4),
      inset -2px 0 4px rgba(0,0,0,0.4);
  }
  .panel-inlay-inner{
    position:absolute; inset:7px;
    box-shadow:
      inset 0 1px 3px rgba(0,0,0,0.5),
      0 1px 0 rgba(255,255,255,0.05);
  }

  .iron-stud{
    display:block;
    width:8px; height:8px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #6b5f4f, #2b2420 75%);
    box-shadow:0 1px 2px rgba(0,0,0,0.6), inset 0 1px 1px rgba(255,255,255,0.1);
  }

  #inviteFlap.opened{ transform:translateY(30px) rotate(8deg); opacity:0; }
  #inviteCardInner.opened{ transform:rotate(0deg) translate(0px,-70px) scale(1.08); }
  #inviteSeal.opened{ opacity:0; transform:translateY(10px) scale(0.85); }
  /* Sections keep their own background fully visible at all times — only
     the content inside fades/slides up as it scrolls into view, so no
     wrong background ever shows through mid-transition. */
  .js-parallax-item{ opacity:0; transform:translateY(24px); transition:opacity .8s ease, transform .8s cubic-bezier(.16,.8,.3,1); }
  .js-parallax-section.in-view .js-parallax-item{ opacity:1; transform:translateY(0); }
  .js-parallax-section.in-view .js-parallax-item:nth-child(1){ transition-delay:.05s; }
  .js-parallax-section.in-view .js-parallax-item:nth-child(2){ transition-delay:.15s; }
  .js-parallax-section.in-view .js-parallax-item:nth-child(3){ transition-delay:.25s; }
  .js-parallax-section.in-view .js-parallax-item:nth-child(4){ transition-delay:.35s; }
  .js-parallax-section.in-view .js-parallax-item:nth-child(5){ transition-delay:.45s; }
  @media (prefers-reduced-motion: reduce){
    .js-parallax-section, .js-parallax-item{ opacity:1 !important; transform:none !important; transition:none !important; }
  }

  /* ---------------------------------------------------------------------
     SCROLL SNAP — each section settles centered in the viewport as the
     guest scrolls, like turning a page of the card.
     --------------------------------------------------------------------- */
  html{
    scroll-behavior:smooth;
    scroll-snap-type:y mandatory;
  }
  .snap-section{
    scroll-snap-align:center;
    scroll-snap-stop:always;
  }
  @media (prefers-reduced-motion: reduce){
    html{ scroll-behavior:auto; scroll-snap-type:none; }
  }

  /* ---------------------------------------------------------------------
     ORNATE CARD FRAME — a wedding-invitation-style double border with
     gilded corner flourishes, reused around each content block so every
     section reads like its own card tucked inside the invite.
     --------------------------------------------------------------------- */
  .invite-card{
    position:relative;
    border-radius:10px;
    box-shadow:0 22px 55px rgba(58,11,18,0.18);
  }
  .invite-card::before{
    content:'';
    position:absolute; inset:8px;
    border:1px solid rgba(201,163,78,0.42);
    border-radius:5px;
    pointer-events:none;
  }
  .invite-card .card-corner{
    position:absolute;
    width:22px; height:22px;
    pointer-events:none;
    border-color:rgba(232,150,31,0.65);
  }
  .invite-card .card-corner.tl{ top:9px; left:9px; border-top:2px solid; border-left:2px solid; border-radius:3px 0 0 0; }
  .invite-card .card-corner.tr{ top:9px; right:9px; border-top:2px solid; border-right:2px solid; border-radius:0 3px 0 0; }
  .invite-card .card-corner.bl{ bottom:9px; left:9px; border-bottom:2px solid; border-left:2px solid; border-radius:0 0 0 3px; }
  .invite-card .card-corner.br{ bottom:9px; right:9px; border-bottom:2px solid; border-right:2px solid; border-radius:0 0 3px 0; }
  .invite-card.invite-card-dark::before{ border-color:rgba(240,216,150,0.3); }
  .invite-card.invite-card-dark .card-corner{ border-color:rgba(240,216,150,0.55); }

  /* Gold-foil heading treatment for use on deep maroon backgrounds only
     (needs a dark backdrop to read — never use on cream/white sections). */
  .foil-text{
    background:linear-gradient(180deg, #F4B94D 0%, #E8961F 45%, #C9A34E 75%, #8A6420 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  /* ---------------------------------------------------------------------
     FALLING PETALS — soft marigold/rose petals drifting down over the
     names section, generated at runtime (see JS) with randomised size,
     drift, spin and timing so no two fall the same way.
     --------------------------------------------------------------------- */
  .petals-layer{ position:absolute; inset:0; overflow:hidden; pointer-events:none; }
  .petal{
    position:absolute;
    top:-8%;
    opacity:0;
    border-radius:0 100% 0 100%;
    will-change:transform, opacity;
    animation-name:petalFall;
    animation-timing-function:ease-in-out;
    animation-iteration-count:infinite;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,0.25));
  }
  .petal-marigold{ background:linear-gradient(135deg, #F4B94D 0%, #E8961F 55%, #C9622C 100%); }
  .petal-brass{ background:linear-gradient(135deg, #F0D896 0%, #C9A34E 55%, #8A6420 100%); }
  .petal-rose{ background:linear-gradient(135deg, #E9A0AC 0%, #C24A5C 55%, #7A1E2B 100%); }

  @keyframes petalFall{
    0%   { transform:translate(0, -10%) rotate(0deg); opacity:0; }
    8%   { opacity:0.95; }
    25%  { transform:translate(calc(var(--drift) * 0.3), 25vh) rotate(90deg); }
    50%  { transform:translate(calc(var(--drift) * -0.35), 50vh) rotate(185deg); }
    75%  { transform:translate(calc(var(--drift) * 0.55), 75vh) rotate(300deg); }
    92%  { opacity:0.9; }
    100% { transform:translate(var(--drift), 112vh) rotate(var(--spin)); opacity:0; }
  }
  @media (prefers-reduced-motion: reduce){
    .petals-layer{ display:none; }
  }

  /* ---------------------------------------------------------------------
     MARIGOLD GARLAND CORNERS — small SVG flower clusters tucked into the
     corners of key cards for an extra floral touch beyond the falling
     petals. Purely decorative, pointer-events disabled.
     --------------------------------------------------------------------- */
  .floral-corner{
    position:absolute;
    width:46px; height:46px;
    pointer-events:none;
    opacity:0.85;
    z-index:2;
  }
  .floral-corner.fc-tl{ top:-14px; left:-14px; }
  .floral-corner.fc-tr{ top:-14px; right:-14px; transform:scaleX(-1); }
  .floral-corner.fc-br{ bottom:-14px; right:-14px; transform:scale(-1); }
  .floral-corner.fc-bl{ bottom:-14px; left:-14px; transform:scaleY(-1); }

  /* ---------------------------------------------------------------------
     HERO BACKGROUND VIDEO — full-bleed video behind the hero content.
     Two <source> elements with media queries let the browser pick the
     mobile or desktop clip; a dark maroon overlay keeps text readable.
     --------------------------------------------------------------------- */
  .hero-video{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:0;
  }
  .hero-video-overlay{
    position:absolute;
    inset:0;
    z-index:1;
    background:
      linear-gradient(180deg, rgba(58,11,18,0.55) 0%, rgba(58,11,18,0.35) 45%, rgba(10,6,3,0.75) 100%);
    pointer-events:none;
  }
</style>
</head>

    <svg viewBox="0 0 100 100" class="w-full h-full">
      <ellipse class="flame" cx="50" cy="42" rx="9" ry="18" fill="#F4B94D"/>
      <ellipse class="flame" cx="50" cy="46" rx="5" ry="11" fill="#E8961F"/>
      <path d="M20 62 Q50 90 80 62 Q80 78 50 82 Q20 78 20 62 Z" fill="#C9A34E"/>
      <ellipse cx="50" cy="62" rx="30" ry="8" fill="#E0B565"/>
    </svg>
  </div>

<!-- ================= MAIN SITE ================= -->
<div id="site">

  <!-- ============ HERO SECTION ============ -->
  <section id="hero" class="snap-section relative min-h-screen flex flex-col items-center justify-center text-center px-5 py-16 overflow-hidden bg-maroon-deep">
    <!-- Background video: mobile clip on small screens, desktop clip on larger screens.
         Source selection is done in JS (see script below) rather than relying on
         <source media="..."> switching, which several mobile browsers ignore for
         <video>, causing the clip to silently fail to load. -->
    <video id="heroVideo" class="hero-video" autoplay muted loop playsinline webkit-playsinline preload="auto"></video>
    <div class="hero-video-overlay"></div>

    <div class="font-display text-xl md:text-2xl text-brass-light tracking-wide relative z-[2] mb-10 [text-shadow:0_2px_10px_rgba(0,0,0,0.6)]">॥ श्री गणेशाय नमः ॥</div>

    <button id="inviteCardBtn" type="button" aria-label="Open Invitation" class="absolute z-[20] right-4 bottom-6 md:right-10 md:bottom-10 group cursor-pointer bg-transparent border-none p-0 outline-none focus-visible:ring-2 focus-visible:ring-brass-light rounded-lg">
      <svg id="inviteCardSvg" viewBox="0 0 200 260" style="overflow:visible;" class="w-[110px] h-auto md:w-[140px] drop-shadow-[0_16px_30px_rgba(0,0,0,0.55)] transition-transform duration-300 group-hover:-translate-y-1 group-active:scale-95">
        <defs>
          <linearGradient id="cardPaper" x1="0" y1="0" x2="0.3" y2="1">
            <stop offset="0%" stop-color="#FFFEFA"/>
            <stop offset="100%" stop-color="#F3E6C4"/>
          </linearGradient>
          <linearGradient id="envBody" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#E9DAB5"/>
            <stop offset="55%" stop-color="#DCC48C"/>
            <stop offset="100%" stop-color="#BC9C5E"/>
          </linearGradient>
          <linearGradient id="envSideL" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#000000" stop-opacity="0.30"/>
            <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
          </linearGradient>
          <linearGradient id="envSideR" x1="1" y1="0" x2="0" y2="0">
            <stop offset="0%" stop-color="#000000" stop-opacity="0.24"/>
            <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
          </linearGradient>
          <linearGradient id="envTopShade" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#000000" stop-opacity="0.28"/>
            <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
          </linearGradient>
          <linearGradient id="flapGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#E4A340"/>
            <stop offset="65%" stop-color="#CC841C"/>
            <stop offset="100%" stop-color="#93600F"/>
          </linearGradient>
          <radialGradient id="sealGrad" cx="32%" cy="26%" r="85%">
            <stop offset="0%" stop-color="#AE3742"/>
            <stop offset="48%" stop-color="#7C1E2A"/>
            <stop offset="100%" stop-color="#3B0A10"/>

<script>
(function () {
  "use strict";

  // ---------------------------------------------------------------------
  // 1. LOAD CONFIG — everything editable lives in the <script id="wedding-
  //    config"> JSON block above. Parse it once, fall back safely if the
  //    block is missing or malformed so the page never breaks.
  // ---------------------------------------------------------------------
  var CONFIG = {};
  try {
    var raw = document.getElementById('wedding-config').textContent;
    CONFIG = JSON.parse(raw);
  } catch (err) {
    console.error('Wedding config could not be parsed, using fallback text.', err);
    CONFIG = {
      couple: { brideName: 'दुल्हन', groomName: 'दूल्हा', coupleShort: 'शादी' },
      event: { titleHindi: 'शुभ विवाह', dateDisplay: '', dateISO: '', timeDisplay: '', cityLine: '' },
      ceremony: { title: 'विवाह समारोह', titleEnglish: 'Wedding Ceremony' },
      venue: { name: '', city: '', mapQuery: '' },
      rsvp: { deadlineDisplay: '', introText: '', whatsappNumber: '', whatsappMessage: '' },
      gallery: { sectionTitle: 'Photo Gallery', sectionEyebrow: 'Our Moments', emptyStateNote: '', images: [] },
      footer: { line: '' }
    };
  }

  function setText(id, value) {
    var el = document.getElementById(id);
    if (el && value !== undefined && value !== null) el.textContent = value;
  }

  // ---------------------------------------------------------------------
  // 2. RENDER — push config values into the DOM.
  // ---------------------------------------------------------------------
  document.title = CONFIG.event.titleHindi + ' | ' + CONFIG.couple.brideName + ' & ' + CONFIG.couple.groomName;

  setText('preloaderTitle', CONFIG.event.titleHindi);
  setText('inviteCardTitle', CONFIG.event.titleHindi);
  setText('inviteCardNames', CONFIG.couple.brideName + ' ❋ ' + CONFIG.couple.groomName);
  setText('inviteSealLetter', (CONFIG.couple.brideName || '').charAt(0));

  var introTitle = document.getElementById('introTitle');
  if (introTitle) {
    introTitle.innerHTML = 'शुभ <span class="text-marigold-light">विवाह</span>';
  }
  var introNames = document.getElementById('introNames');
  if (introNames) {
    introNames.innerHTML = (CONFIG.couple.brideName || '') +
      ' <span class="font-display not-italic text-marigold-light mx-3">❋</span> ' +
      (CONFIG.couple.groomName || '');
  }
  setText('introDateCity', [CONFIG.event.dateDisplay, CONFIG.event.cityLine].filter(Boolean).join(' · '));

  setText('ceremonyTitle', CONFIG.ceremony.title);
  setText('ceremonyTitleEnglish', CONFIG.ceremony.titleEnglish);
  setText('ceremonyDate', CONFIG.event.dateDisplay);
  setText('ceremonyTime', CONFIG.event.timeDisplay);
  setText('ceremonyVenueLine', [CONFIG.venue.name, CONFIG.venue.city].filter(Boolean).join(', '));

  setText('venueName', CONFIG.venue.name);
  setText('venueCity', CONFIG.venue.city);
  var mapFrame = document.getElementById('venueMapFrame');
  var directionsLink = document.getElementById('venueDirectionsLink');
  // Embeds need a text query (a short goo.gl link can't be used as an iframe
  // src for search embedding), so the embed always uses mapQuery/venue name+
  // city. The "Get Directions" button prefers an explicit mapLink (e.g. a
  // maps.app.goo.gl share link) when one is provided, falling back to a
  // query-based link otherwise.
  var embedQuery = CONFIG.venue.mapQuery || [CONFIG.venue.name, CONFIG.venue.city].filter(Boolean).join(', ');
  if (embedQuery && mapFrame) {
    var q = encodeURIComponent(embedQuery);
    mapFrame.src = 'https://maps.google.com/maps?q=' + q + '&t=&z=15&ie=UTF8&iwloc=&output=embed';
  }
  if (directionsLink) {
    if (CONFIG.venue.mapLink) {
      directionsLink.href = CONFIG.venue.mapLink;
    } else if (embedQuery) {
      directionsLink.href = 'https://maps.google.com/?q=' + encodeURIComponent(embedQuery);
    }
  }

  // Hosted-by / parents' names — shown under the couple's names on the
  // intro section. Wording flips depending on CONFIG.side ("groom" or
  // "bride") so the family being introduced first matches who is hosting.
  var hostsBlock = document.getElementById('hostsBlock');
  if (CONFIG.hosts && hostsBlock) {
    var groomLine = (CONFIG.couple.groomName || '') + ' — ' + (CONFIG.hosts.groomParents || '');
    var brideLine = (CONFIG.couple.brideName || '') + ' — ' + (CONFIG.hosts.brideParents || '');

    var firstLine = CONFIG.side === 'bride' ? brideLine : groomLine;
    var secondLine = CONFIG.side === 'bride' ? groomLine : brideLine;

    var blessingsHtml = CONFIG.hosts.blessingsLine
      ? '<p class="mt-2 text-brass-light/80 italic">' + CONFIG.hosts.blessingsLine + '</p>'
      : '';

    hostsBlock.innerHTML =
      '<p class="mb-1">' + firstLine + '</p>' +
      '<p>' + secondLine + '</p>' +
      blessingsHtml;
  }
  setText('invitationNote', CONFIG.hosts ? CONFIG.hosts.invitationNote : '');

  // Add to Google Calendar — builds a prefilled Google Calendar event link
  // from the ceremony date/time, venue, and couple names in CONFIG.
  var addCalBtn = document.getElementById('addToCalendarBtn');
  if (addCalBtn && CONFIG.event && CONFIG.event.dateISO) {
    var startDate = new Date(CONFIG.event.dateISO);
    if (!isNaN(startDate.getTime())) {
      var endDate = new Date(startDate.getTime() + 3 * 60 * 60 * 1000); // default 3-hour duration
      var toGCalDate = function (d) {
        return d.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
      };
      var gcalTitle = encodeURIComponent(
        (CONFIG.event.titleHindi || 'Wedding') + ' — ' +
        (CONFIG.couple.brideName || '') + ' & ' + (CONFIG.couple.groomName || '')
      );
      var gcalDates = toGCalDate(startDate) + '/' + toGCalDate(endDate);
      var gcalLocation = encodeURIComponent([CONFIG.venue.name, CONFIG.venue.city].filter(Boolean).join(', '));
      var gcalDetails = encodeURIComponent(
        (CONFIG.ceremony ? CONFIG.ceremony.title : '') +
        (CONFIG.event.timeDisplay ? ' — ' + CONFIG.event.timeDisplay : '')
      );
      addCalBtn.href = 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + gcalTitle +
        '&dates=' + gcalDates + '&details=' + gcalDetails + '&location=' + gcalLocation;
    }
  }

  // Venue parking / metro note appended to the venue address line
  if (CONFIG.venue.parkingNote) {
    var venueCityEl = document.getElementById('venueCity');
    if (venueCityEl) {
      venueCityEl.insertAdjacentHTML('afterend',
        '<p class="text-sm text-ink/60 mt-1">' + CONFIG.venue.parkingNote + '</p>');
    }
  }

  setText('footerLine', CONFIG.footer.line);
  setText('footerCoupleDate', [CONFIG.couple.coupleShort, CONFIG.event.dateDisplay].filter(Boolean).join(' · '));

  // ---------------------------------------------------------------------
  // 2b. HERO BACKGROUND VIDEO — pick mobile vs desktop clip via JS (more
  //     reliable across browsers than <source media="..."> on <video>,
  //     which several mobile browsers ignore), then force playback since
  //     some browsers need an explicit .play() call even with autoplay set.
  // ---------------------------------------------------------------------
  (function initHeroVideo() {
    var video = document.getElementById('heroVideo');
    if (!video) return;

    var DESKTOP_SRC = 'https://thesurajdev.github.io/wedding-invite/desktop_arti.webm';
    var MOBILE_SRC = 'https://thesurajdev.github.io/wedding-invite/mobile_arti.webm';
    var isDesktop = window.innerWidth >= 768;
    video.src = isDesktop ? DESKTOP_SRC : MOBILE_SRC;

    video.addEventListener('error', function () {
      console.error('Hero video failed to load:', video.currentSrc || video.src, video.error);
    });

    function tryPlay() {
      var playPromise = video.play();
      if (playPromise && typeof playPromise.catch === 'function') {
        playPromise.catch(function (err) {
          console.warn('Hero video autoplay was blocked, will retry on first user interaction.', err);
          var resumeOnInteract = function () {
            video.play().catch(function () {});
            document.removeEventListener('touchstart', resumeOnInteract);
            document.removeEventListener('click', resumeOnInteract);
          };
          document.addEventListener('touchstart', resumeOnInteract, { once: true, passive: true });
          document.addEventListener('click', resumeOnInteract, { once: true });
        });
      }
    }
    video.addEventListener('loadedmetadata', tryPlay);
    tryPlay();

    // Re-evaluate on resize/orientation change so rotating a phone (or
    // resizing a desktop window across the breakpoint) swaps the clip.
    var resizeTimer;
    window.addEventListener('resize', function () {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(function () {
        var nowDesktop = window.innerWidth >= 768;
        var wanted = nowDesktop ? DESKTOP_SRC : MOBILE_SRC;
        if (video.src !== wanted && !video.src.endsWith(wanted)) {
          var wasPlaying = !video.paused;
          video.src = wanted;
          if (wasPlaying) tryPlay();
        }
      }, 300);
    });
  })();

  // ---------------------------------------------------------------------
  // 3. PRELOADER
  // ---------------------------------------------------------------------
  var fill = document.getElementById('loadFill');
  var pct = document.getElementById('loadPct');
  var preloader = document.getElementById('preloader');
  var doorScene = document.getElementById('door-scene');
  var site = document.getElementById('site');

  var progress = 0;
  var loadInterval = setInterval(function () {
    progress += Math.random() * 18 + 6;
    if (progress >= 100) {
      progress = 100;
      clearInterval(loadInterval);
      if (fill) fill.style.width = '100%';
      if (pct) pct.textContent = 'Loading 100%';
      setTimeout(function () {
        if (preloader) preloader.classList.add('hide');
        if (doorScene) doorScene.classList.add('show');
        if (site) site.classList.add('reveal');
      }, 350);
      return;
    }
    if (fill) fill.style.width = progress + '%';
    if (pct) pct.textContent = 'Loading ' + Math.floor(progress) + '%';
  }, 220);

  // Safety net: if something above throws or hangs, don't leave the user
  // staring at a blank/black screen forever.
  setTimeout(function () {
    if (preloader && !preloader.classList.contains('hide')) {
      preloader.classList.add('hide');
    }
    if (site && !site.classList.contains('reveal')) {
      site.classList.add('reveal');
    }
  }, 6000);

  // ---------------------------------------------------------------------
  // 4. DOOR OPEN INTERACTION — plays a synthesized shankh (conch) sound
  //    on open. Generated with the Web Audio API (no external audio file)
  //    so it's self-contained and fires reliably on the user's click/tap,
  //    which also satisfies browser autoplay-permission rules.
  // ---------------------------------------------------------------------
  var doorFrame = document.getElementById('doorFrame');
  var opened = false;

  // Background music: replace with your hosted mp3 URL once available.
  // Left blank for now — playBackgroundMusic() no-ops safely if empty.
  var BG_MUSIC_SRC = 'https://thesurajdev.github.io/wedding-invite/Ganesh_Aarti.mp3';

  // Prime the audio element immediately (not on click) so the browser has
  // already started buffering/decoding it well before the door is tapped —
  // this is what makes playback start instantly in sync with the door
  // animation instead of lagging behind while the file loads.
  var bgAudioEl = document.getElementById('bgMusic');
  if (bgAudioEl && BG_MUSIC_SRC) {
    bgAudioEl.src = BG_MUSIC_SRC;
    bgAudioEl.volume = 0.6;
    bgAudioEl.load();
  }

  // Secondary track — takes over (with a crossfade) the first time the
  // visitor scrolls past the hero into the intro section.
  var BG_MUSIC_SECONDARY_SRC = 'https://thesurajdev.github.io/wedding-invite/wedding_song.mp3';
  var bgAudioSecondaryEl = document.getElementById('bgMusicSecondary');
  if (bgAudioSecondaryEl && BG_MUSIC_SECONDARY_SRC) {
    bgAudioSecondaryEl.src = BG_MUSIC_SECONDARY_SRC;
    bgAudioSecondaryEl.volume = 0;
    bgAudioSecondaryEl.load();
  }
  var TARGET_VOLUME = 0.6;
  var CROSSFADE_MS = 1500;
  var tracksSwitched = false;

  // Starts the secondary track immediately at volume 0, in parallel with
  // the primary track, so it is already playing (not just loaded) by the
  // time the scroll trigger fires — the "switch" then becomes a pure
  // volume crossfade with zero start-up latency instead of waiting on a
  // fresh .play() call at switch time.
  function primeSecondaryTrackPlayback() {
    if (!bgAudioSecondaryEl || !BG_MUSIC_SECONDARY_SRC) return;
    bgAudioSecondaryEl.volume = 0;
    var playPromise = bgAudioSecondaryEl.play();
    if (playPromise && typeof playPromise.catch === 'function') {
      playPromise.catch(function (err) {
        console.warn('Secondary background track could not pre-start; will attempt again on switch.', err);
      });
    }
  }

  function crossfadeToSecondaryTrack() {
    if (tracksSwitched) return;
    if (!bgAudioSecondaryEl || !BG_MUSIC_SECONDARY_SRC) return;
    tracksSwitched = true;

    var startPlaying = function () {
      // If pre-starting earlier succeeded, this is a no-op (already
      // playing); if it was blocked, this is the fallback attempt.
      if (bgAudioSecondaryEl.paused) {
        var playPromise = bgAudioSecondaryEl.play();
        if (playPromise && typeof playPromise.catch === 'function') {
          playPromise.catch(function (err) {
            console.warn('Secondary background track autoplay was blocked.', err);
          });
        }
      }

      var steps = 30;
      var stepMs = CROSSFADE_MS / steps;
      var i = 0;
      var fadeTimer = setInterval(function () {
        i++;
        var t = i / steps;
        bgAudioSecondaryEl.volume = Math.min(TARGET_VOLUME, TARGET_VOLUME * t);
        if (bgAudioEl) {
          bgAudioEl.volume = Math.max(0, TARGET_VOLUME * (1 - t));
        }
        if (i >= steps) {
          clearInterval(fadeTimer);
          if (bgAudioEl) {
            bgAudioEl.pause();
            bgAudioEl.volume = TARGET_VOLUME; // reset in case it's ever resumed elsewhere
          }
        }
      }, stepMs);
    };

    startPlaying();
  }

  function playBackgroundMusic() {
    if (!BG_MUSIC_SRC) return;
    var audio = bgAudioEl || document.getElementById('bgMusic');
    if (!audio) return;
    try {
      if (!audio.src) audio.src = BG_MUSIC_SRC;
      audio.volume = 0.6;
      // currentTime reset in case a prior blocked-autoplay attempt left it
      // partway through a buffered-but-unplayed state.
      var playPromise = audio.play();
      if (playPromise && typeof playPromise.catch === 'function') {
        playPromise.catch(function (err) {
          console.warn('Background music autoplay was blocked; it will start on next interaction.', err);
        });
      }
    } catch (err) {
      console.error('Background music could not be played.', err);
    }
  }

  function playShankhSound() {
    try {
      var AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      var ctx = new AudioCtx();
      var now = ctx.currentTime;
      var duration = 2.6;
      var baseFreq = 146; // a deep, resonant horn-like pitch

      // Master envelope: quick swell in like a breath, held, then a slow fade.
      var master = ctx.createGain();
      master.gain.setValueAtTime(0.0001, now);
      master.gain.exponentialRampToValueAtTime(0.5, now + 0.28);
      master.gain.setValueAtTime(0.5, now + duration * 0.55);
      master.gain.exponentialRampToValueAtTime(0.0001, now + duration);
      master.connect(ctx.destination);

      // Warm lowpass so the harmonics blend into a rounded, shell-like tone.
      var filter = ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(1200, now);
      filter.frequency.exponentialRampToValueAtTime(600, now + duration);
      filter.connect(master);

      // Fundamental + a few harmonics for a horn-like richness, with a
      // gentle vibrato on the fundamental to mimic breath control.
      [1, 2, 2.98, 4].forEach(function (mult, i) {
        var osc = ctx.createOscillator();
        osc.type = i === 0 ? 'sawtooth' : 'sine';
        osc.frequency.setValueAtTime(baseFreq * mult, now);

        var g = ctx.createGain();
        g.gain.value = i === 0 ? 1 : 0.32 / mult;

        if (i === 0) {
          var lfo = ctx.createOscillator();
          lfo.frequency.value = 4.5;
          var lfoGain = ctx.createGain();
          lfoGain.gain.value = 3;
          lfo.connect(lfoGain);
          lfoGain.connect(osc.frequency);
          lfo.start(now);
          lfo.stop(now + duration);
        }

        osc.connect(g);
        g.connect(filter);
        osc.start(now);
        osc.stop(now + duration + 0.1);
      });

      // A touch of filtered noise for the breathy texture of a blown shell.
      var bufferSize = Math.floor(ctx.sampleRate * duration);
      var noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      var data = noiseBuffer.getChannelData(0);
      for (var i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * 0.15;
      var noise = ctx.createBufferSource();
      noise.buffer = noiseBuffer;
      var noiseFilter = ctx.createBiquadFilter();
      noiseFilter.type = 'bandpass';
      noiseFilter.frequency.value = baseFreq * 2;
      noiseFilter.Q.value = 0.7;
      var noiseGain = ctx.createGain();
      noiseGain.gain.value = 0.4;
      noise.connect(noiseFilter);
      noiseFilter.connect(noiseGain);
      noiseGain.connect(master);
      noise.start(now);
      noise.stop(now + duration);
    } catch (err) {
      console.error('Shankh sound could not be played.', err);
    }
  }

  function openDoor() {
    if (opened) return;
    opened = true;
    // Fire music first, before any class changes, so it starts the instant
    // the door begins animating rather than after the visual work is queued.
    playBackgroundMusic();
    primeSecondaryTrackPlayback();
    playShankhSound();
    doorScene.classList.add('opened');
    var doorWall = document.getElementById('doorWall');
    if (doorWall) doorWall.style.opacity = '0';
    var doorSeam = document.getElementById('doorSeam');
    if (doorSeam) doorSeam.style.opacity = '0';
    setTimeout(function () {
      doorScene.classList.add('dismiss');
      document.body.style.overflow = 'auto';
    }, 1400);
  }

  document.body.style.overflow = 'hidden';
  if (doorFrame) {
    doorFrame.addEventListener('click', openDoor);
    doorFrame.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        openDoor();
      }
    });
  }

  // ---------------------------------------------------------------------
  // 5. FALLING PETALS — spawns marigold/rose/brass petals that drift down
  //    over the names section only, each with randomised size, sway, spin
  //    and timing so the fall never looks mechanical or repetitive.
  // ---------------------------------------------------------------------
  (function initPetals() {
    var layer = document.getElementById('introPetals');
    if (!layer) return;
    var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduceMotion) return;

    var colors = ['petal-marigold', 'petal-brass', 'petal-rose'];
    var count = window.innerWidth < 640 ? 22 : 32;

    for (var i = 0; i < count; i++) {
      var petal = document.createElement('span');
      var size = 9 + Math.random() * 10;          // 9–19px
      var duration = 9 + Math.random() * 8;        // 9–17s per fall
      var delay = -(Math.random() * duration);     // stagger so petals are already mid-fall on load
      var drift = Math.round((Math.random() - 0.5) * 220); // -110px .. 110px sideways sway
      var spin = Math.round(180 + Math.random() * 360);

      petal.className = 'petal ' + colors[Math.floor(Math.random() * colors.length)];
      petal.style.left = Math.random() * 100 + '%';
      petal.style.width = size + 'px';
      petal.style.height = size * 0.85 + 'px';
      petal.style.animationDuration = duration + 's';
      petal.style.animationDelay = delay + 's';
      petal.style.setProperty('--drift', drift + 'px');
      petal.style.setProperty('--spin', spin + 'deg');
      petal.style.opacity = String(0.6 + Math.random() * 0.35);

      layer.appendChild(petal);
    }
  })();

  // ---------------------------------------------------------------------
  // 6. SCROLL REVEAL
  // ---------------------------------------------------------------------
  var parallaxSections = document.querySelectorAll('.js-parallax-section');
  if ('IntersectionObserver' in window) {
    var revealObserver = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) entry.target.classList.add('in-view');
      });
    }, { threshold: 0.2, rootMargin: '0px 0px -10% 0px' });
    parallaxSections.forEach(function (sec) { revealObserver.observe(sec); });
  } else {
    parallaxSections.forEach(function (sec) { sec.classList.add('in-view'); });
  }

  // ---------------------------------------------------------------------
  // 6b. MUSIC TRACK SWITCH — crossfade from the hero track to the
  //     secondary track the first time the visitor scrolls past the hero
  //     into the intro section.
  // ---------------------------------------------------------------------
  var introSectionForAudio = document.getElementById('intro');
  if (introSectionForAudio && 'IntersectionObserver' in window) {
    var audioSwitchObserver = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          crossfadeToSecondaryTrack();
          audioSwitchObserver.disconnect();
        }
      });
    }, { threshold: 0.35 });
    audioSwitchObserver.observe(introSectionForAudio);
  }

  // ---------------------------------------------------------------------
  // 7. INVITATION CARD OPEN
  // ---------------------------------------------------------------------
  var inviteCardBtn = document.getElementById('inviteCardBtn');
  var inviteFlap = document.getElementById('inviteFlap');
  var inviteCardInner = document.getElementById('inviteCardInner');
  var inviteSeal = document.getElementById('inviteSeal');
  var inviteLabel = document.getElementById('inviteLabel');
  var introSection = document.getElementById('intro');
  var inviteOpened = false;

  if (inviteCardBtn) {
    inviteCardBtn.addEventListener('click', function () {
      if (inviteOpened) return;
      inviteOpened = true;

      if (inviteLabel) {
        inviteLabel.style.opacity = '0';
        inviteLabel.style.pointerEvents = 'none';
      }

      if (inviteSeal) inviteSeal.classList.add('opened');
      if (inviteFlap) inviteFlap.classList.add('opened');
      setTimeout(function () {
        if (inviteCardInner) inviteCardInner.classList.add('opened');
      }, 150);

      setTimeout(function () {
        if (introSection) introSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }, 750);
    });
  }

})();
</script>

</body>
